    <script src="auth-api.js"></script>
    <script>
        // Verifica se está autenticado ao carregar a página
        (async function() {
            const isAuth = await window.SisAuth.isAuthenticated();
            const docLink = document.getElementById('docLink');
            
            if (isAuth) {
                // Se autenticado, ir direto para documentacao
                docLink.href = 'documentacao-new.html';
                console.log('[Index] User is authenticated, docs link points to documentacao-new.html');
            } else {
                // Se não autenticado, ir para login
                docLink.href = 'login-new.html?redirect=documentacao-new.html';
                console.log('[Index] User is NOT authenticated, docs link points to login');
            }
        })();
    </script>
